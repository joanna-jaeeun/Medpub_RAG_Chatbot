name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Offline: fakes replace PubMed and OpenAI, so no secrets are needed here
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t medpub-rag .
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 medpub-rag
          for i in $(seq 1 20); do
            curl -fs localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
