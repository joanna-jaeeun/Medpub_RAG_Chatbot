# Render Blueprint: two free web services from the same Docker image.
# After the first deploy, set API_URL on the UI service to the API's public URL,
# and in each service's settings choose "Auto-Deploy: After CI checks pass".
services:
  - type: web
    name: medpub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ENTREZ_EMAIL
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: DAILY_LIMIT
        value: "30"

  - type: web
    name: medpub-ui
    runtime: docker
    plan: free
    # No shell wrapper: Streamlit reads its port and address from the env vars below
    dockerCommand: streamlit run app.py
    envVars:
      - key: API_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: STREAMLIT_SERVER_PORT
        value: "10000"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
